[package]
name = "khervedb"
version = "0.1.0"
description = "KherveDB - NIST XPS binding energy database"
authors = ["Gwilherm Kerherve"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "khervedb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = ["unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Small binary
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
